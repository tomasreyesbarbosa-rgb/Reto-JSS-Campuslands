<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ordenar Nombres</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Ordenar Arrays de Cadenas</h1>
    <p>Ingrese nombres en la caja de texto de abajo y ordene este listado el cual apareceran en el área de texto</p>

    <div>
        <label>Nombre:</label>
        <input type="text" id="nombre">
        <button onclick="agregar()">Agregar y ordenar nombre</button>
    </div>

    <hr>

    <h2>Nombres ordenados</h2>

    <div>
        <textarea id="resultado" readonly placeholder="Aqui apareceran lo nombres ordenados"></textarea>
        <button onclick="limpiar()">Limpiar</button>
    </div>

    <script src="js/JavaScript.js"></script>
</body>
</html>
